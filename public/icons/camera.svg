<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    POSA — icona minimale

    Quattro segni: corpo, pentaprisma, lente, perforazioni.

    Le perforazioni non sono decorazione. Senza di loro questa e'
    l'icona fotocamera di Material, Feather e Font Awesome: il segno
    piu' universale, quindi il piu' anonimo. Sono loro a dire
    «pellicola» invece che «fotocamera», ed e' quella la differenza
    fra l'app di chiunque e questa.

    Il tratto e' 22px perche' va dimensionato sulla resa piccola, non
    su quella grande: a 8px il disegno era elegante a 1024 e spariva a
    192, dove restavano un pixel e mezzo. Cosi' ne restano quattro.
    Per la stessa ragione le perforazioni sono sette e non nove: a
    dimensione launcher nove diventavano un tratteggio indistinto.

    Un solo linguaggio, tutto a contorno. Unica eccezione motivata le
    perforazioni piene: i fori della pellicola sono aperture, non
    contorni.

    Centro ottico 18px sopra il centro geometrico — una forma con un
    elemento in cima appare piu' bassa di quanto sia.

    Palette dell'app: fondo #14100C (surface), segno #E8834A (primary).
  -->

